# Built-in defaults. User (~/.config/dev-loop/config.toml) and project (dev-loop.toml) values override these.

[agent]
kind = "pi"
pi_path = "pi"
cursor_path = "cursor-agent"
pi_args = []           # extra args before the prompt, e.g. ["--trust"]
cursor_args = []

[steps.research]
skill = "create-research"
output = "<KEY>-research.md"
label = "in-research"

[steps.frd]
skill = "create-frd"
output = "<KEY>-frd.md"
label = "in-research"

[steps.user-review]
kind = "user-review"
label = "user-review"

[steps.development]
skill = "development"
output = "<KEY>-change-record.md"
label = "in-progress"

[steps.code-review]
kind = "review"
skill = "code-review"
output = "<KEY>-code-review.json"
label = "in-review"

[steps.rules-review]
kind = "review"
skill = "rules-review"
output = "<KEY>-rules-review.json"
label = "in-review"

[steps.complexity-review]
kind = "review"
skill = "complexity-review"
output = "<KEY>-complexity-review.json"
label = "in-review"

[steps.qa-review]
kind = "review"
skill = "qa-review"
output = "<KEY>-qa-review.json"
label = "in-review"

# Loops run in array order. Each loop lists its steps. iterations = 0 or time_limit = "0" turns that limit off.
[[loops]]
name = "definition"
steps = ["research", "frd", "user-review"]
iterations = 3
time_limit = "1h"

[[loops]]
name = "execution"
steps = ["development", "code-review", "rules-review", "complexity-review", "qa-review"]
iterations = 3
time_limit = "1h"

[github]
enabled = false
gh_path = "gh"
auto_create_pr = false

[gitlab]
enabled = false
glab_path = "glab"
auto_create_mr = false

[telegram]
enabled = false
token = ""
chat_id = ""

[task]
prefix = "TASK-"   # key for tasks with no source and no issue: <prefix><task ID>

[markdown]
dir = ".features"      # folder for <KEY>/ documents, relative to the repo root
repo = ""              # empty: task worktree. Path to another git repo (relative to project dir or absolute)
auto_commit = false
auto_push = false
